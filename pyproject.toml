[project]
name = "alambic-search"
version = "0.9.0b1"
description = "Alambic Search — GED interrogeable : indexation des sources documentaires et questions avec citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "smbprotocol>=1.17.0",
    "ldap3>=2.9.1",
    "boto3>=1.43.123",
    "pyjwt[crypto]>=2.8",
    "pypdfium2>=4.30",
    "pillow>=10.4",
]

[project.scripts]
alambic-search = "ged.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",  # client de test recommandé par Starlette
    "reportlab>=4.0",
    "ruff>=0.6",
    "pyftpdlib>=2.2.0",
    "moto[s3]>=5.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ged"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:ldap3.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Idiome FastAPI : Depends/Form/Header en valeur par défaut
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Header", "fastapi.Query"]
