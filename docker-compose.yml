# Pile complète : PostgreSQL/pgvector + Ollama (embeddings et LLM) + API.
# Réglages lus dans .env (modèles, dossier à indexer, mots de passe).
# Carte NVIDIA : make up-gpu (voir docker-compose.gpu.yml).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ged
      POSTGRES_PASSWORD: ged
      POSTGRES_DB: ged
    ports:
      # 5433 côté poste : évite le conflit avec un PostgreSQL déjà installé localement (5432)
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ged"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    environment:
      # Taille du contexte : la question + ses extraits doivent tenir, sinon troncature silencieuse
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: 30m      # garde le modèle chargé entre deux questions
    ports:
      - "127.0.0.1:11434:11434"   # accès depuis le poste (ollama list, make run)
    volumes:
      - ollama:/root/.ollama

  # Conversion PDF des fichiers bureautiques (LibreOffice) : vraies pages pour Word, Excel…
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3000:3000"   # accès depuis le poste (make run) ; jamais exposé au réseau
    restart: unless-stopped

  # Reclassement des résultats (cross-encoder BAAI/bge-reranker-v2-m3) servi par Text Embeddings
  # Inference. Démarré seulement avec `make rerank` (ou --profile rerank). Premier démarrage :
  # téléchargement du modèle (~2 Go, gardé dans le volume). Carte NVIDIA : RERANK_IMAGE (voir .env.example).
  # Téléchargement impossible depuis le conteneur (proxy, erreur « relative URL without a base ») :
  # make rerank-modele (téléchargé sur le poste dans ./models), puis RERANK_MODEL_ID=/models/bge-reranker-v2-m3.
  rerank:
    image: ${RERANK_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    command: ["--model-id", "${RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}", "--max-client-batch-size", "64"]
    ports:
      - "127.0.0.1:8082:80"     # accès depuis le poste (make run) ; jamais exposé au réseau
    volumes:
      - rerank:/data
      - ./models:/models:ro
    profiles: ["rerank"]
    restart: unless-stopped

  # Connexion unique (OIDC) pour Alambic Search, Alambic Light et le portail.
  # Mode développement : royaume « alambic » importé au premier démarrage (keycloak/realm-alambic.json),
  # comptes de démo olivier / alice / bob (mot de passe : demo). Console : http://localhost:8180/admin
  # Les navigateurs le joignent sur localhost:8180 (émetteur des jetons) ; le conteneur api sur
  # keycloak:8180 (oidc.url_interne).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # appels serveur à serveur acceptés sur keycloak:8180
      KC_HTTP_PORT: "8180"
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak:/opt/keycloak/data
    profiles: ["sso"]   # démarré seulement avec make sso (ou --profile sso)
    # alambic_sso : réseau partagé avec la pile d'Alambic Light, qui joint Keycloak sur keycloak:8180
    networks: [default, alambic_sso]

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      gotenberg:
        condition: service_started
    # Toutes les variables de .env (mots de passe des sources : SMB_PASSWORD, ALFRESCO_PASSWORD,
    # SHAREPOINT_SECRET…). Celles d'« environment » ci-dessous l'emportent (adresses internes à Docker).
    env_file:
      - path: .env
        required: false
    environment:
      CONVERT_URL: http://gotenberg:3000
      # Reclassement : seulement si RERANK_URL est renseigné dans .env, joint alors dans Docker
      RERANK_URL: ${RERANK_URL:+http://rerank:80}
      OIDC_INTERNAL_URL: http://keycloak:8180/realms/alambic   # oidc.url_interne dans sources.yaml
      DATABASE_URL: postgresql://ged:ged@db:5432/ged
      EMBED_BASE_URL: http://ollama:11434/v1
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL-qwen2.5:7b}   # vide dans .env : pas de LLM, réponses = extraits
      SOURCES_FILE: /config/sources.yaml
      DOCUMENTS_DIR: /data/partage   # ${DOCUMENTS_DIR} dans sources.yaml = dossier monté ci-dessous
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD (console d'administration)}
      TZ: Europe/Paris
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      LDAP_PASSWORD: ${LDAP_PASSWORD:-}
      # Alambic Light lancé à part sur le poste : joint via host.docker.internal
      ALAMBIC_LIGHT_URL: ${ALAMBIC_LIGHT_URL_DOCKER:-http://host.docker.internal:8001}
      ALAMBIC_LIGHT_API_KEY: ${ALAMBIC_LIGHT_API_KEY:-}
      ALAMBIC_LIGHT_SECRET: ${ALAMBIC_LIGHT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # natif sous Docker Desktop, utile sous Linux
    volumes:
      # Dossier du projet monté en entier (lecture seule) : monter sources.yaml seul fait créer
      # par Docker un DOSSIER à sa place s'il est introuvable au démarrage (piège Docker Desktop)
      - ./:/config:ro
      # Dossier du poste à indexer (DOCUMENTS_DIR dans .env), vu dans le conteneur sous /data/partage
      - ${DOCUMENTS_DIR:-./demo-data}:/data/partage:ro
    ports:
      - "8002:8000"   # 8002 côté poste (8000 souvent déjà pris)

networks:
  alambic_sso:
    external: true   # créé par make sso (docker network create alambic_sso)

volumes:
  rerank:
  keycloak:
  pgdata:
  ollama:
