# Accès d'Ollama à une carte NVIDIA (Docker Desktop WSL2 ou Linux + NVIDIA Container Toolkit).
# Utilisé par `make db-gpu` / `make up-gpu`. Sous Windows avec une carte AMD : installer Ollama
# directement sur Windows plutôt que dans Docker.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Reclassement sur la carte : RERANK_IMAGE=ghcr.io/huggingface/text-embeddings-inference:1.8
  # (Ampere, Ada : RTX 30xx/40xx) ou …:turing-1.8 (RTX 20xx) dans .env, puis make rerank-gpu.
  rerank:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
