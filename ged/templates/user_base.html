<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Rechercher{% endblock %} · Alambic Search</title>
<link rel="icon" href="/admin/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/static/alambic-ui/alambic.css">
<link rel="stylesheet" href="/admin/static/console.css">
<script src="/admin/static/htmx.min.js" defer></script>
</head>
<body class="al-app">
{% include "_bandeau.html" %}
{% if bandeau(request).user %}
<div class="al-shell">
  {% include "_nav.html" %}
  <main class="al-main" id="main"><div class="user-main">
    {% block content %}{% endblock %}
  </div></main>
</div>
{% else %}
<main class="user-main" id="main">
  {{ self.content() }}
</main>
{% endif %}
</body>
</html>
